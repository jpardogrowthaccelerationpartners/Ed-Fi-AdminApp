name: On Pull Request

on:
  push:
    branches: [main, "patch-v*"]
  pull_request:
    branches: [main, "patch-v*", "dependabot/**"]
  workflow_dispatch:

# Adopt standard concurrency pattern
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Set broad read permissions; job-level security-events added where needed
permissions: read-all

jobs:
  scan-actions-bidi:
    name: Scan Actions, scan all files for BIDI Trojan Attacks
    uses: ed-fi-alliance-oss/ed-fi-actions/.github/workflows/repository-scanner.yml@main
    with:
      config-file-path: ./.github/workflows/bidi-config.json

  setup:
    name: Setup
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node (from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies (ci)
        run: npm ci --legacy-peer-deps

  code_analysis:
    name: Code Analysis (CodeQL & Dependency Review)
    needs: setup
    runs-on: ubuntu-26.04
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0

  lint:
    name: Prettier Check
    needs: setup
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node (from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies (ci)
        run: npm ci --legacy-peer-deps

      - name: Fix Prettier issues
        run: npm run prettier:write

      - name: Verify Prettier formatting
        run: npm run prettier:check

  build_and_test:
    name: Build & Test (${{ matrix.package }})
    needs: lint
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        package: [fe, be, models, models-server, utils]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node (from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies (ci)
        run: npm ci --legacy-peer-deps

      - name: Determine actual Nx project name
        id: proj
        run: |
            if [ "${{ matrix.package }}" = "be" ]; then echo "actual=api" >> "$GITHUB_OUTPUT"; else echo "actual=${{ matrix.package }}" >> "$GITHUB_OUTPUT"; fi

      - name: Build (if build target exists)
        run: |
          ACTUAL="${{ steps.proj.outputs.actual }}"
          if npm run | grep -q "build:${ACTUAL}"; then
              npm run "build:${ACTUAL}"
          elif npx nx show project "$ACTUAL" 2>/dev/null | grep -q "targets:.*build"; then
              npx nx run "$ACTUAL:build"
          else
            echo "No build step for $ACTUAL; skipping build."
          fi

      - name: Unit Test
        run: |
          ACTUAL="${{ steps.proj.outputs.actual }}"
          echo "Running tests for $ACTUAL"
          mkdir -p test-results
          npm run test:$ACTUAL
      - name: Upload Unit Test Results
        if: always() && hashFiles('test-results/junit-*.xml') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-tests-${{ matrix.package }}
          path: "test-results"
          retention-days: 5

  docker_analysis:
    name: Docker Analysis
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        package: [fe, api]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: packages/${{ matrix.package }}/Dockerfile
          failure-threshold: error

      - name: Docker Build
        run: docker build -t adminapp-${{ matrix.package }}-ci -f packages/${{ matrix.package }}/Dockerfile .

  compose_config:
    name: Compose Config Validation
    runs-on: ubuntu-26.04
    # Reads files and runs a parser; needs no API access and no git credential.
    permissions: {}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Renders the stack from compose/.env.example without starting anything;
      # `docker compose config` only parses and interpolates, so no daemon is needed.
      # The script is the single source of truth and is runnable locally as
      # `npm run compose:check` - see eng/testing/README.md for what it does and does
      # not catch.
      - name: Validate compose configuration
        run: pwsh ./eng/testing/check-compose-config.ps1

  event_file:
    name: "Event File"
    runs-on: ubuntu-26.04
    steps:
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Event File
          path: ${{ github.event_path }}
